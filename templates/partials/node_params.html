<!--
  node_params.html
  우측 "속성" 패널의 기본(빈) 상태. 노드/엣지 선택 시 canvas.js 가
  이 컨테이너(#node-params)를 동적으로 다시 그린다.

  노드 선택 시 렌더 내용:
    - 정적 params 입력: params.path.<k>, params.query.<k>, params.header.<k>, params.body
      (operation.params_schema 의 path/query/header 항목 + request_schema 의 body)
    - 입력값은 Drawflow 노드 data.params 에 즉시 반영되고, 저장 시 toContractGraph 가
      §4 Node.params{path,query,header,body} 로 직렬화한다.

  엣지 선택 시 렌더 내용 (§7 동적 값은 엣지 매핑으로만):
    - 선행 노드(source) operation 의 response_schema → "from" 후보 필드 칩 목록.
      클릭하면 활성 매핑 행의 from 칸에 경로($.id, $[0].name 등) 자동 입력.
    - 다음 노드(target) operation 의 params_schema(path/query/header)+requestBody →
      "to" 후보 필드 칩 목록. 클릭하면 to 칸에 경로(params.path.petId 등) 자동 입력.
    - "자동 매핑" 버튼: 응답 필드명 ↔ 입력 파라미터명 이름 매칭(정확 일치 우선 +
      느슨한 포함 매칭)으로 행을 미리 채워 제시(수정/삭제/추가 가능).
    - operation 메타는 operationCache 로 보관(스펙 업로드 시 + GET /api/operations/{id}
      lazy fetch). 저장된 워크플로우 재진입 시에도 필드 복원 가능.
    - 스키마가 없으면 fallback: 빈 텍스트 직접 입력 + "스키마 없음 — 직접 입력하세요" 힌트.
    - data_mapping 항목 = {from, to}, 와이어 키는 문자열 "from", "to" 고정(round-trip 보존).
      from: 선행 노드 출력 JSONPath 부분집합 (예 "$.id")
      to:   "params.path.<k>" | "params.query.<k>" | "params.header.<k>" | "params.body" | "params.body.<k>"
-->
